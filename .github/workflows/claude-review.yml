# Claude PR Review — REUSABLE workflow (org-wide).
#
# This is the single source of truth. Consuming repos call it from a tiny
# caller stub (see the README) that owns the `workflow_dispatch` trigger:
#
#   jobs:
#     review:
#       uses: magiqsoftware/claude-review/.github/workflows/claude-review.yml@v1
#       secrets: inherit
#       with:
#         pr_number: ${{ inputs.pr_number }}
#         model: ${{ inputs.model }}
#         scope: ${{ inputs.scope }}
#         force: ${{ inputs.force }}
#
# A called workflow runs in the CALLER'S event context. `secrets: inherit`
# passes ANTHROPIC_API_KEY (set as an organisation secret) and the
# write-capable GITHUB_TOKEN straight through.
#
# Inputs (typed `workflow_dispatch` inputs on the caller, passed straight
# through here):
#   pr_number   PR number to review (required)
#   model       opus | sonnet | haiku (default: sonnet)
#   scope       "code errors" or "all" (default: "code errors")
#   force       bypass the per-PR review cap (default: false)
# Allowlist: organisation (or repo) variable CLAUDE_REVIEW_USERS = JSON array of
#            GitHub logins, e.g. ["plimmerd","alice"].
# Cost cap:  after 3 successful reviews on a PR the workflow declines further
#            runs unless force is set.
# See Azure DevOps work item AB#33808 for the design and rationale.
name: Claude PR Review (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review."
        type: number
        required: true
      model:
        description: "Model: sonnet | opus | haiku."
        type: string
        required: false
        default: sonnet
      scope:
        description: 'Review scope passed to the review command: "code errors" or "all".'
        type: string
        required: false
        default: "code errors"
      force:
        description: "Bypass the per-PR review cap."
        type: boolean
        required: false
        default: false
      review_command:
        description: >-
          Slash command the CI step invokes. Defaults to the org toolkit
          review. A consuming repo may point this at its own
          .claude/commands/<name>.md to run a repo-tuned review instead.
        type: string
        required: false
        default: "/pr-review-toolkit:review-pr"

permissions:
  pull-requests: write
  contents: read
  # PR conversation comments and comment edits are issue-scoped endpoints
  # (gh pr comment, /issues/comments/... PATCH).
  issues: write

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Gate on the curated allowlist. workflow_dispatch is already restricted to
    # users with repo write access, so author_association is guaranteed and no
    # longer checked; CLAUDE_REVIEW_USERS is the finer, curated gate on the actor.
    if: contains(fromJSON(vars.CLAUDE_REVIEW_USERS || '[]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pin the CLI so runs are reproducible and an upstream release can't change
      # the code that executes here alongside repository secrets. Bump deliberately.
      CLAUDE_CODE_VERSION: "2.1.185"
      # Hidden marker embedded in every completed review comment. Counting these on
      # a PR is how the cost cap measures "successful reviews" — issue_comment runs
      # report the default branch, not the PR head, so `gh run list` can't isolate
      # a PR's runs.
      REVIEW_MARKER: "<!-- claude-review:complete -->"
    steps:
      # Secrets (ANTHROPIC_API_KEY, write-capable GITHUB_TOKEN) are present on
      # this run. Refuse fork PRs *before* checking out their head so
      # untrusted PR content can never reach the bypassPermissions agent. A
      # same-repo PR branch can only be pushed by a write-access contributor, so
      # the head is trusted once cross-repo PRs are excluded.
      - name: Refuse cross-repository (fork) PRs
        id: forkguard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          CROSS=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json isCrossRepository -q .isCrossRepository)
          if [ "$CROSS" = "true" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
              --body "🚫 Claude review is disabled for cross-repository (fork) PRs for security reasons (the workflow runs with repository secrets). Re-run from a branch in this repository."
            echo "Refusing to review a cross-repository (fork) PR with secrets present." >&2
            exit 1
          fi

      # Cost cap: decline a run once a PR already has 3 completed reviews, unless
      # the force input is set. Count is the number of prior review comments
      # carrying REVIEW_MARKER. When capped we post an explanatory comment (so the
      # reviewer isn't left with a bare "skipped") and set capped=true; later
      # steps are gated on it and the job still ends green.
      - name: Cost cap check
        id: cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FORCE: ${{ inputs.force }}
        run: |
          COUNT=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json comments \
            -q "[.comments[] | select(.body | contains(\"$REVIEW_MARKER\"))] | length")
          echo "This PR has $COUNT completed Claude review(s); force=$FORCE."

          if [ "$COUNT" -ge 3 ] && [ "$FORCE" != "true" ]; then
            echo "capped=true" >> "$GITHUB_OUTPUT"
            # Deliberately NO marker in this comment, so it doesn't inflate the count.
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
          "⏭️ Skipping this Claude review: this PR has already had **$COUNT** reviews, and reviews are capped at 3 to limit cost. Re-run the workflow with the **force** input enabled (Actions → Run workflow → tick *force*, or \`gh workflow run … -f force=true\`) to run one anyway."
            echo "Cost cap reached — declining this review." >&2
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review-started comment
        id: startcomment
        if: success() && steps.cap.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ACTOR: ${{ github.actor }}
        run: |
          # gh prints the created comment URL ending in #issuecomment-<id>; the
          # trailing -<id> is the comment id we PATCH later. Validate it parsed to
          # digits so a future gh output change fails loudly here instead of
          # silently 404-ing every later PATCH while the job still reports success.
          URL=$(gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "🔍 Claude review started (triggered by @${ACTOR})…")
          ID="${URL##*-}"
          case "$ID" in
            ''|*[!0-9]*)
              echo "Could not parse comment id from gh output: '$URL'" >&2
              exit 1 ;;
          esac
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Started comment id: $ID"

      - name: Checkout
        if: success() && steps.cap.outputs.capped != 'true'
        uses: actions/checkout@v7
        with:
          # Full commit graph is needed so the three-dot `git diff base...HEAD`
          # merge-base resolves. blob:none makes it a partial (blobless) clone:
          # historical file contents are fetched lazily only for what's actually
          # diffed, not the whole repo. On a large repo that turns an ~80s checkout
          # into ~10-15s with no change to the diff. fetch-tags: false skips
          # enumerating thousands of tags the review never uses.
          fetch-depth: 0
          filter: blob:none
          fetch-tags: false
          # Do not persist GITHUB_TOKEN in .git/config (artipacked hardening);
          # gh provides auth for git operations via `gh auth setup-git` below.
          persist-credentials: false

      - name: Check out PR head and resolve base branch
        id: pr
        if: success() && steps.cap.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          gh pr checkout "${{ inputs.pr_number }}"
          BASE=$(gh pr view "${{ inputs.pr_number }}" --json baseRefName -q .baseRefName)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git fetch origin "$BASE"

      - name: Setup Node
        if: success() && steps.cap.outputs.capped != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache npm downloads
        if: success() && steps.cap.outputs.capped != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-claude-${{ runner.os }}-${{ env.CLAUDE_CODE_VERSION }}
          restore-keys: |
            npm-claude-${{ runner.os }}-

      - name: Install Claude Code CLI
        if: success() && steps.cap.outputs.capped != 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # The marketplace install tracks the latest published plugin; the CLI has
      # no version pin for marketplace plugins. The pinned CLI above is the main
      # reproducibility anchor.
      - name: Install pr-review-toolkit plugin
        if: success() && steps.cap.outputs.capped != 'true'
        run: |
          claude plugin marketplace add anthropics/claude-plugins-official
          claude plugin install pr-review-toolkit@claude-plugins-official

      - name: Run Claude review
        id: review
        if: success() && steps.cap.outputs.capped != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_REF: ${{ steps.pr.outputs.base }}
          REVIEW_MODEL: ${{ inputs.model }}
          REVIEW_SCOPE: ${{ inputs.scope }}
        run: |
          set -o pipefail
          PROMPT="${{ inputs.review_command }} ${REVIEW_SCOPE}

          You are reviewing PR #${PR_NUMBER} in CI. There are no unstaged changes;
          the PR's changes are the diff between 'origin/${BASE_REF}' and HEAD. Use
          'git diff origin/${BASE_REF}...HEAD' and
          'git diff --name-only origin/${BASE_REF}...HEAD' to identify changed files.
          Produce the aggregated markdown summary as your final message."
          claude -p "$PROMPT" \
            --model "$REVIEW_MODEL" \
            --permission-mode bypassPermissions \
            --output-format text | tee review.md

      - name: Update status comment with the review
        if: success() && steps.cap.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ steps.startcomment.outputs.id }}
          REVIEW_MODEL: ${{ inputs.model }}
          REVIEW_SCOPE: ${{ inputs.scope }}
        run: |
          if [ ! -s review.md ]; then
            echo "Review output was empty" >&2
            exit 1
          fi

          # Append the hidden completion marker (counted by the cost cap) and a
          # collapsed how-to for running the same review locally.
          {
            printf '\n\n---\n'
            printf '%s\n' "$REVIEW_MARKER"
            printf '_Reviewed by Claude (`%s`, scope: `%s`)._\n\n' "$REVIEW_MODEL" "$REVIEW_SCOPE"
            printf '<details><summary>Run a Claude review locally</summary>\n\n'
            printf '```sh\n'
            printf 'claude plugin marketplace add anthropics/claude-plugins-official\n'
            printf 'claude plugin install pr-review-toolkit@claude-plugins-official\n'
            printf 'claude "/pr-review-toolkit:review-pr"\n'
            printf '```\n\n'
            printf '</details>\n'
          } >> review.md

          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
            -F body=@review.md

      - name: Report failure
        # Skip when the fork guard already posted its own explanatory comment.
        if: failure() && steps.forkguard.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ steps.startcomment.outputs.id }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="⚠️ Claude review failed — see the Actions run log: ${RUN_URL}"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
          fi
